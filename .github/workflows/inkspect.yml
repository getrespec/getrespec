name: Inkspect Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: inkspect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Inkspect Code Review
    # Release PRs only bump versions and date the changelog; skip them to save the daily review quota.
    if: ${{ !github.event.pull_request.draft && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Inkspect Cloud Engine
        uses: inkspect-code-review/inkspect-action@5c0ffcf30f00819fb91029f92264e491f79bcb84 # v1
        with:
          ci-workflow: CI
