# Publishes a GitHub release when a release pull request is merged into main (see RELEASING.md).
# On every push to main: if package.json has a version that isn't tagged yet and CHANGELOG.md has a
# section for it, run the tests, tag v<version> on that commit, and publish the release with that
# section as its notes. Any other push to main is skipped.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether this commit is a release
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version yet; not a release commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests
        if: steps.check.outputs.release == 'true'
        run: node --test test/*.test.mjs

      - name: Extract the release notes from CHANGELOG.md
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "CHANGELOG.md's section for $VERSION is empty" >&2
            exit 1
          fi

      - name: Tag and publish the release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Respec v$VERSION" --notes-file notes.md
