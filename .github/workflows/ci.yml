# Runs the tests on every push to main and every pull request, and checks that each pull request
# adds a CHANGELOG.md entry (see RELEASING.md).
# The "Tests" badge at the top of README.md shows this workflow's latest result on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the tests
        run: node --test test/*.test.mjs

  changelog:
    # A pull request that changes nothing a learner or contributor would notice (CI tweaks, test-only
    # changes, typo fixes) can skip this with the "skip-changelog" label.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE...HEAD" | grep -qx CHANGELOG.md; then
            echo "Add what changed under '## [Unreleased]' in CHANGELOG.md, or label the PR 'skip-changelog' if nobody would notice the change." >&2
            exit 1
          fi
